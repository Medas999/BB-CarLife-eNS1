name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set v4.2 package version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\\s+\\d+', 'versionCode 420', s)
          s=re.sub(r'versionName\\s+"[^"]+"', 'versionName "4.2-aa-full-video"', s)
          p.write_text(s)
          PY

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Show APK package
        if: success()
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BB-CarLife-eNS1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
